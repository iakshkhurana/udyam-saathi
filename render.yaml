services:
  - type: web
    name: udyam-saathi-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_TODAY
        value: "2026-07-15"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BACKOFFICE_PIN
        sync: false
      - key: DOC_ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-sonnet-5-5
      - key: TWILIO_AUTH_TOKEN
        sync: false
