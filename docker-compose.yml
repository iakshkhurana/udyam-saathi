services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      - backend-storage:/app/backend/storage

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "npm ci && npm run build && npx vite preview --host 0.0.0.0 --port 5173 --strictPort"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend-storage:
